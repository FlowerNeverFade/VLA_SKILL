base_model_path: ../data/model/pi05_base
skill_root: ../data/skill
output_root: ../outputs/pi05_skill_router_lora

channels:
  - channel_id: so101_pick_cube
    skill_id: so101_pick_cube
    lora_group: C
  - channel_id: libero_16_turn_on_the_stove
    skill_id: libero_16_turn_on_the_stove
    lora_group: C

router:
  type: lora_control
  feature_hook: pi05_paligemma_with_expert
  state_embed_dim: 64
  hidden_dim: 256
  use_previous_skill: false

train:
  steps: 1000
  batch_size: 4
  eval_every: 100
  save_every: 500
  log_every: 10
  num_workers: 2
  lr: 2.5e-5
  router_lr: 1.0e-4
  router_ce_weight: 1.0
  device: cuda
  dtype: bfloat16
